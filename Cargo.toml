[package]
name = "flowerss-bot"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
encoding_rs = "0.8"
feed-rs = "3"
hard-xml = "1.43"
hex = "0.4"
html-escape = "0.2"
opml = "1.1"
prost = "0.14"
quick-xml = "0.42"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "http2", "json", "multipart", "rustls-tls-native-roots", "socks"] }
rss = { version = "2.1", default-features = false }
scraper = { version = "0.29", default-features = false, features = ["deterministic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql", "sqlite"] }
teloxide-core = { version = "0.13", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

[dev-dependencies]
tiny_http = "0.12"
tempfile = "3"
