name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: Linux-64bit
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
            name: Linux-32bit
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macOS-64bit
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macOS-ARM64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-64bit
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'i686-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Build and package
        env:
          APP_VERSION: ${{ github.event.release.tag_name }}
          TARGET: ${{ matrix.target }}
          ARTIFACT: flowerss-bot_${{ github.event.release.tag_name }}_${{ matrix.name }}
        run: |
          export APP_COMMIT="${GITHUB_SHA:0:7}" BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cargo build --locked --release --target "$TARGET"
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp "target/$TARGET/release/flowerss-bot.exe" .
            tar -a -cf "$ARTIFACT.zip" flowerss-bot.exe README.md config.yml.sample LICENSE
          else
            cp "target/$TARGET/release/flowerss-bot" .
            tar -czf "$ARTIFACT.tar.gz" flowerss-bot README.md config.yml.sample LICENSE
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            flowerss-bot_*.tar.gz
            flowerss-bot_*.zip
